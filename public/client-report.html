<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis DPO | CDPA Verdict & POTRAZ Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { display: ['Plus Jakarta Sans', 'sans-serif'], sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } }
        }
    </script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>
<body class="bg-[#FAFAFA] dark:bg-[#090D16] text-slate-800 dark:text-slate-200 font-sans min-h-screen flex flex-col lg:flex-row antialiased">

    <aside class="w-full lg:w-64 bg-white dark:bg-[#111827] border-b lg:border-b-0 lg:border-r border-slate-200/80 dark:border-slate-800 flex flex-col justify-between shrink-0">
        <div>
            <div class="h-16 px-5 border-b border-slate-100 dark:border-slate-800 flex items-center gap-2.5">
                <img src="assets/axis-logo.png" alt="Axis Solutions" class="w-32 h-auto object-contain">
            </div>
            <nav class="p-3 space-y-1">
                <a href="client-overview.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fa-solid fa-chart-pie w-4 text-center"></i> Executive Overview</a>
                <a href="client-dp1.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fa-solid fa-file-contract w-4 text-center"></i> 1. Form DP1 Licence</a>
                <a href="client-dp2.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fa-solid fa-id-badge w-4 text-center"></i> 2. Form DP2 DPO Notice</a>
                <a href="client-kaspersky.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fa-solid fa-radar w-4 text-center"></i> 3. Kaspersky Logs</a>
                <a href="client-report.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold bg-slate-900 dark:bg-slate-800 text-white"><i class="fa-solid fa-file-shield w-4 text-center"></i> 4. CDPA Verdict & POTRAZ</a>
            </nav>
        </div>
        <div class="p-3 border-t border-slate-100 dark:border-slate-800">
            <a href="index.html" class="w-full py-2 px-3 rounded-lg bg-slate-900 dark:bg-slate-800 text-white text-xs font-medium flex items-center justify-center gap-2">Sign Out</a>
        </div>
    </aside>

    <main class="flex-1 p-6 md:p-8 max-w-5xl w-full mx-auto space-y-6">
        <div class="flex items-center justify-between">
            <div>
                <span class="text-[11px] font-mono uppercase text-slate-400">Regulatory Determination</span>
                <h1 class="font-display text-2xl font-bold text-slate-900 dark:text-white mt-0.5">CDPA SI 155 Audit Report</h1>
            </div>
            <button onclick="window.print()" class="px-5 py-2.5 bg-indigo-600 text-white text-xs font-semibold rounded-xl">
                <i class="fa-solid fa-print mr-1.5"></i> Print / Save POTRAZ PDF
            </button>
        </div>

        <div class="bg-white dark:bg-[#111827] border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 flex items-center justify-between">
            <div>
                <span class="text-[11px] font-mono uppercase text-slate-400">Statutory Standing</span>
                <h2 id="standing-title" class="font-display text-2xl font-bold mt-1">Evaluating...</h2>
                <p id="standing-desc" class="text-xs text-slate-500 mt-1"></p>
            </div>
            <div class="text-right">
                <span class="text-[11px] font-mono uppercase text-slate-400 block">Composite Score</span>
                <span id="final-score" class="font-display text-4xl font-extrabold">0%</span>
            </div>
        </div>

        <div class="bg-white dark:bg-[#111827] border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 space-y-3">
            <h3 class="font-display text-sm font-bold">Required Remediation & POTRAZ Actions</h3>
            <div id="recs-container" class="space-y-2 text-xs"></div>
        </div>
    </main>

    <script>
        const dp1 = JSON.parse(localStorage.getItem('axis_dp1') || 'null');
        const dp2 = JSON.parse(localStorage.getItem('axis_dp2') || 'null');
        const kasp = JSON.parse(localStorage.getItem('axis_kasp') || 'null');

        let score = (dp1 ? 20 : 0) + (dp2 ? 20 : 0);
        const recs = [];

        if (!dp1) recs.push('Upload Form DP1 Data Controller Licence.');
        else if (dp1.daysRemaining <= 90) recs.push(`POTRAZ Licence Renewal Alert: Expires on ${dp1.expiryDate} (${dp1.daysRemaining} days remaining — inside 3 months).`);

        if (!dp2) recs.push('Upload Form DP2 DPO Appointment Notice.');

        if (!kasp) {
            recs.push('Upload Kaspersky Next XDR logs to verify Section 18 technical safeguards.');
        } else {
            let sec18 = 40;
            let sec20 = 20;
            if (kasp.flags.includes('Unpatched Endpoints')) { sec18 -= 15; recs.push('CDPA Sec. 18: Patch outdated endpoints flagged in Kaspersky logs.'); }
            if (kasp.flags.includes('Active Malware')) { sec18 -= 20; recs.push('CDPA Sec. 18: Quarantine malware-infected hosts.'); }
            if (kasp.flags.includes('Ransomware Signature')) {
                sec18 = 0; sec20 = 0;
                recs.unshift('CRITICAL BREACH (SEC. 20): Ransomware detected! Submit Form DP3 to POTRAZ within 72 hours.');
            }
            score += Math.max(0, sec18) + sec20;
        }

        document.getElementById('final-score').innerText = `${score}%`;
        document.getElementById('standing-title').innerText = score >= 85 ? 'Compliant & Audit Ready' : 'Remediation Required';
        document.getElementById('standing-desc').innerText = `Entity: ${dp1?.entityName || 'Vanguard Holdings'} • Licence Expiry: ${dp1?.expiryDate || 'Not Verified'}`;

        document.getElementById('recs-container').innerHTML = recs.length
            ? recs.map(r => `<div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800">${r}</div>`).join('')
            : '<div class="p-3.5 rounded-xl bg-emerald-50 text-emerald-800">All statutory filings and technical controls are satisfied.</div>';
    </script>
<script>
async function buildReport(){
 try{
 const d=await AxisAuth.request('/client/records'), dp1=d.dp1, dp2=d.dp2, kasp=d.kaspersky;
 let score=(dp1.verified?20:0)+(dp2.verified?20:0), recs=[];
 if(!dp1.verified)recs.push('Upload Form DP1 Data Controller Licence.');
 else if(dp1.days_remaining!==null&&dp1.days_remaining<=90)recs.push(`Licence renewal required: expires ${dp1.expiry_date} (${dp1.days_remaining} days remaining).`);
 if(!dp2.verified)recs.push('Upload Form DP2 DPO Appointment Notice.');
 if(!kasp.filename)recs.push('Upload Kaspersky telemetry logs to assess technical safeguards.');
 else {let sec18=40,sec20=20;
 if(kasp.flags.includes('Unpatched Endpoints')){sec18-=15;recs.push('Review and patch unpatched endpoints.');}
 if(kasp.flags.includes('Active Malware')){sec18-=20;recs.push('Investigate and quarantine malware-affected hosts.');}
 if(kasp.flags.includes('Ransomware Signature')){sec18=0;sec20=0;recs.unshift('Critical security finding: ransomware indicator detected. Escalate immediately and assess applicable breach-notification obligations.');}
 score+=Math.max(0,sec18)+sec20;}
 document.getElementById('final-score').innerText=`${score}%`;
 document.getElementById('standing-title').innerText=score>=85?'Compliance indicators positive':'Remediation required';
 document.getElementById('standing-desc').innerText=`Organisation: ${d.company.name} • Licence expiry: ${dp1.expiry_date||'Not recorded'}`;
 document.getElementById('recs-container').innerHTML=recs.length?recs.map(x=>`<div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800">${x}</div>`).join(''):'<div class="p-3.5 rounded-xl bg-emerald-50 text-emerald-800">No outstanding items were identified by the records currently on file.</div>';
 }catch(e){console.error(e);}
}
AxisAuth.guard('client');buildReport();
</script>
</body>
</html>
